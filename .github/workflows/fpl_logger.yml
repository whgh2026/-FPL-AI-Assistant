name: Continuous Learning Engine

on:
  schedule:
    - cron: '0 16 * * 5' # Friday Snapshot
    - cron: '0 10 * * 2' # Tuesday Ingest
    - cron: '0 10 * * 3' # Wednesday Auto-Tune
  workflow_dispatch:

permissions:
  contents: write # Crucial for auto-committing weights.json

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pulp pandas psycopg2-binary numpy

      - name: Friday Snapshot
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 16 * * 5'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/snapshot_xp.py

      - name: Tuesday Ingest Actuals
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * 2'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/ingest_actuals.py

      - name: Wednesday Auto-Tune & Commit
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * 3'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/auto_tune.py
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add weights.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-tune: Recalibrated baseline weights" && git push)
